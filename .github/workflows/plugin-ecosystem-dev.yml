name: Plugin Ecosystem CI & Dev Binary Build

on:
  push:
    branches:
      - main
      - "fix/*"
      - "feat/*"
      - "test/*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Plugin System Verification & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Client Plugin Test Suite
        run: pnpm --filter client test plugins

      - name: Run Package Manifest Contract Tests
        run: node --test tests/packages/package-manifest.test.mjs

      - name: Run Community Packages Contract Tests
        run: node --test tests/packages/community-packages-contract.test.mjs

  build-desktop-dev:
    name: Build TriliumDEV Desktop Artifact
    needs: verify
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Desktop App Bundle
        run: pnpm --filter desktop build

      - name: Package Electron Executable
        run: pnpm --filter desktop electron-forge:package

      - name: Upload TriliumDEV Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriliumDEV-Desktop-macOS
          path: apps/desktop/out/
